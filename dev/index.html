    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      // Apply the saved theme before the first paint, otherwise the page flashes the wrong
      // colours on load. Mirrors dev/theme.ts.
      try {
        const stored = localStorage.getItem('solid-countup-theme')
        if (stored === 'light' || stored === 'dark') {
          document.documentElement.dataset.theme = stored
        }
      } catch {}
    </script>
    <title>solid-countup — a Solid component that animates a number</title>
